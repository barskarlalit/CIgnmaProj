name: Test AWS OIDC

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC claims
        env:
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$OIDC_URL&audience=sts.amazonaws.com" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          PAYLOAD="$PAYLOAD" python3 -c '
          import base64, json, os
          p=os.environ["PAYLOAD"]
          p += "=" * (-len(p) % 4)
          d=json.loads(base64.urlsafe_b64decode(p))
          print("issuer:", d.get("iss"))
          print("audience:", d.get("aud"))
          print("subject:", d.get("sub"))
          print("repository:", d.get("repository"))
          print("ref:", d.get("ref"))
          '